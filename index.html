<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zyklus – Trainingsplan</title>
<meta name="description" content="Editierbarer Trainingsplan im Wochen-Zyklus: Übungen abhaken, Plan anpassen, Workout-Zeit tracken.">
<meta name="theme-color" content="#06070B">
<meta name="color-scheme" content="dark">
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zyklus">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="hdr">
  <div class="hdr-top">
    <div id="hdr-date" class="hdr-date"></div>
    <button id="badge-week" class="badge-week" type="button" aria-haspopup="dialog">
      <span id="badge-week-text"></span>
    </button>
    <div class="hdr-right">
      <span id="hdr-timer" class="hdr-timer" hidden></span>
      <span id="hdr-count" class="hdr-count"></span>
      <button id="btn-basics" class="iconbtn" type="button" aria-haspopup="dialog" aria-label="Basics – Trainingsprinzipien">?</button>
    </div>
  </div>

  <div id="strip-wrap" class="strip-wrap">
    <div id="strip" class="strip" role="tablist" aria-label="Trainingstage des Zyklus"></div>
  </div>
  <div id="pager" class="pager" aria-hidden="true"></div>

  <div id="dayprog" class="dayprog" aria-hidden="true"></div>
</header>

<main id="main"></main>

<button id="jump-open" class="jump-open" type="button" hidden>↓ Nächste offene</button>

<!-- Basics-Sheet -->
<div id="sheet-basics" class="sheet" role="dialog" aria-modal="true" aria-label="Basics" hidden>
  <div class="sheet-scrim" data-close="1"></div>
  <div class="sheet-panel">
    <div class="sheet-grip" data-close="1"><i></i></div>
    <div class="sheet-head">
      <h2>Basics</h2>
      <button class="sheet-x" type="button" data-close="1" aria-label="Schließen">✕</button>
    </div>
    <div id="basics-body" class="sheet-body"></div>
    <div id="basics-zones" class="zones"></div>
  </div>
</div>

<!-- Zyklus-Sheet -->
<div id="sheet-cycle" class="sheet" role="dialog" aria-modal="true" aria-label="Zyklus" hidden>
  <div class="sheet-scrim" data-close="1"></div>
  <div class="sheet-panel sheet-panel--short">
    <div class="sheet-grip" data-close="1"><i></i></div>
    <div class="sheet-head">
      <h2>Zyklus</h2>
      <button class="sheet-x" type="button" data-close="1" aria-label="Schließen">✕</button>
    </div>
    <div class="sheet-body">
      <p class="cyc-q">Zykluslänge:</p>
      <div class="cyc-len">
        <button id="cyc-minus" class="cyc-step" type="button" aria-label="Eine Woche weniger">−</button>
        <b id="cyc-len-val">2 Wochen</b>
        <button id="cyc-plus" class="cyc-step" type="button" aria-label="Eine Woche mehr">+</button>
      </div>
      <p class="cyc-q">Diese Kalenderwoche ist:</p>
      <div id="cyc-weeks" class="cyc-choice"></div>
      <p id="cyc-hint" class="cyc-hint"></p>
      <button id="cyc-reset" class="cyc-reset" type="button">Plan auf Startplan zurücksetzen</button>
    </div>
  </div>
</div>

<!-- Übung-hinzufügen-Sheet -->
<div id="sheet-add" class="sheet" role="dialog" aria-modal="true" aria-label="Übung hinzufügen" hidden>
  <div class="sheet-scrim" data-close="1"></div>
  <div class="sheet-panel">
    <div class="sheet-grip" data-close="1"><i></i></div>
    <div class="sheet-head">
      <h2 id="add-title">Übung hinzufügen</h2>
      <button class="sheet-x" type="button" data-close="1" aria-label="Schließen">✕</button>
    </div>
    <div class="sheet-body">
      <input id="add-search" class="field" type="search" placeholder="Datenbank durchsuchen …"
             autocomplete="off" autocorrect="off" autocapitalize="off">
      <button id="add-new-toggle" class="new-toggle" type="button">＋ Neue Übung anlegen</button>
      <div id="add-form" class="new-form" hidden>
        <input id="add-name" class="field" type="text" placeholder="Name der Übung" autocomplete="off">
        <input id="add-qty" class="field" type="text" placeholder="Menge / Dauer (z. B. 3 x 8 reps)" autocomplete="off">
        <input id="add-note" class="field" type="text" placeholder="Anweisung (z. B. schwer/ kontrolliert)" autocomplete="off">
        <button id="add-save" class="save-btn" type="button">In den Plan übernehmen</button>
      </div>
      <div id="add-list" class="db-list"></div>
    </div>
  </div>
</div>

<!-- Kalender-Sheet -->
<div id="sheet-cal" class="sheet" role="dialog" aria-modal="true" aria-label="Trainingskalender" hidden>
  <div class="sheet-scrim" data-close="1"></div>
  <div class="sheet-panel">
    <div class="sheet-grip" data-close="1"><i></i></div>
    <div class="sheet-head">
      <h2>Kalender</h2>
      <button class="sheet-x" type="button" data-close="1" aria-label="Schließen">✕</button>
    </div>
    <div class="sheet-body">
      <div class="cal-nav">
        <button id="cal-prev" class="cal-step" type="button" aria-label="Voriger Monat">‹</button>
        <b id="cal-title"></b>
        <button id="cal-next" class="cal-step" type="button" aria-label="Nächster Monat">›</button>
      </div>
      <div id="cal-dow" class="cal-dow" aria-hidden="true"></div>
      <div id="cal-grid" class="cal-grid"></div>
      <div id="cal-stats" class="cal-stats"></div>
      <div id="cal-detail" class="cal-detail"></div>
    </div>
  </div>
</div>

<!-- Übungsdatenbank-Sheet -->
<div id="sheet-db" class="sheet" role="dialog" aria-modal="true" aria-label="Übungsdatenbank" hidden>
  <div class="sheet-scrim" data-close="1"></div>
  <div class="sheet-panel">
    <div class="sheet-grip" data-close="1"><i></i></div>
    <div class="sheet-head">
      <h2>Übungsdatenbank</h2>
      <button class="sheet-x" type="button" data-close="1" aria-label="Schließen">✕</button>
    </div>
    <div class="sheet-body">
      <p id="db-count" class="db-count"></p>
      <input id="db-search" class="field" type="search" placeholder="Übung suchen …"
             autocomplete="off" autocorrect="off" autocapitalize="off">
      <div id="db-list" class="db-list"></div>
      <p class="db-hint">Aus dem Plan entfernte Übungen landen automatisch hier. Zurück in den
        Plan: „Bearbeiten“ → „Übung hinzufügen“ am gewünschten Tag.</p>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
